name: Refresh meta.json

# 每周从洛克王国 BWIKI 重新抓取社区推荐与技能数据。内容有变化才提交，没变化不产生提交。
# 计划任务只会在默认分支上运行；也可以在 Actions 页面手动触发（workflow_dispatch）。
on:
  schedule:
    - cron: '17 3 * * 1' # 每周一 03:17 UTC（北京时间 11:17），避开整点
  workflow_dispatch:

permissions:
  contents: write
  issues: write # 新投稿系统出现真实投稿时提一个 issue

concurrency:
  group: refresh-meta
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      # 先确认基线是绿的：之后如果变红，就知道是新数据造成的。
      - name: Test before refresh
        run: npm test

      # 数据骤减（技能/阵容/作者少于现有 10% 以上、最近投稿日期倒退）时脚本会失败并保留旧文件。
      - name: Refresh spirit learnsets and traits
        run: npm run data

      - name: Rebuild reviewed lineup leads
        run: npm run scout

      - name: Fetch from BWIKI
        run: npm run meta

      - name: Test refreshed data
        run: npm test

      # 对阵速查用 data.json 的种族值；数据日志比它新时只提醒（页面上也会有警告），不阻塞技能和阵容的刷新。
      - name: Warn if data.json is behind the change log
        run: |
          node -e "
            const c = (require('./meta.json').changes || {}).dataCheck;
            if (c && c.mismatched.length) console.log('::warning::data.json 的种族值与赛季调整日志不一致 ' + c.mismatched.length + '/' + c.checked + ' 项，对阵速查可能在用过期数值');
            else console.log(c ? 'data.json 与调整日志一致（' + c.checked + ' 项）' : '没有赛季调整日志');
          "

      - name: Commit if changed
        run: |
          if git diff --quiet -- meta.json data.json dex.json scout.json; then
            echo "公开资料没有变化"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add meta.json data.json dex.json scout.json
          git commit -m "Refresh meta.json from BWIKI ($(date -u +%F))"
          git push

      # BWIKI 2026-07 改版的新投稿系统（含“适用版本”）一旦出现真实投稿，就提一个 issue 提醒接入阵容码解码。
      # 只提一次：查的是全部状态的 issue，所以关掉之后也不会重复提。提 issue 失败不影响本次刷新。
      - name: Open an issue when the new submission system has real data
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          REAL=$(node -e "const s=require('./meta.json').source.newSystem; console.log(s ? s.lineups.real + s.builds.real : 0)")
          echo "新投稿系统的真实投稿数：$REAL"
          if [ "$REAL" -eq 0 ]; then
            exit 0
          fi
          echo "::warning::BWIKI 新投稿系统出现了 $REAL 份真实投稿，需要接入"
          TITLE="BWIKI 新投稿系统出现了真实投稿，需要接入"
          if [ -n "$(gh issue list --state all --search "\"$TITLE\" in:title" --json number --jq '.[0].number')" ]; then
            echo "已经提过 issue，不再重复"
            exit 0
          fi
          DETAIL=$(node -e "console.log(JSON.stringify(require('./meta.json').source.newSystem, null, 2))")
          gh issue create --title "$TITLE" --body "$(printf '每周刷新发现 BWIKI 的新投稿系统出现了真实投稿：\n\n```json\n%s\n```\n\n下一步：\n- 移植 BWIKI 的 `模块:LineupCode` 解码官方阵容码（`B~…`）\n- 只收录“适用版本”为当前赛季的投稿，见 `season.json`；更早赛季的暂不考虑\n- 培养方案页面的模板格式还没有样本，需要先看一份真实页面\n\n这个 issue 由 `.github/workflows/refresh-meta.yml` 自动创建，只会创建一次。' "$DETAIL")"
